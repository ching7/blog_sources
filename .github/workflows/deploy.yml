name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 北京时间每天 02:00，刷新 GitHub 活跃度

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 抓取失败时脚本自己退出 0，沿用仓库里的旧数据
      - name: Refresh GitHub activity
        run: node scripts/fetch-github.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:unit && npm run test:dist

      # 还有「待确认」文案就不上线
      - name: Check drafts
        run: npm run check:drafts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cyn-blog
